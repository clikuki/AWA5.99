<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Awa5.99 Interpreter</title>
	<link rel="stylesheet" href="style.css">
</head>

<body>
	<h1>🌠 Maximal AWA5.99 Interpreter 🌠</h1>
	<main>
		<div class="wrapper">
			<textarea id="awatalk" spellcheck="false"></textarea>
			<label for="awatalk">Awatalk</label>
		</div>

		<div class="wrapper">
			<textarea id="awaout" disabled></textarea>
			<label for="awaout">Awautput</label>
		</div>
	</main>

	<aside>
		<div class="controls">
			<button class="run">Run</button>
			<button class="step">Step</button>
		</div>
		
		<ul class="stats">
			<li>Index: <span class="awaindex">0</span></li>
			<li>Time: <span class="executionTime">0</span></li>
		</ul>

		<div>
			<span class="list-label">Commands</span>
			<ol class="commands" start="0"></ol>
		</div>
		
		<div>
			<span class="list-label">Bubble Abyss</span>
			<ol class="bubble-abyss" start="0"></ol>
		</div>
	</aside>

	<script src="/build/awaparser.js"></script>
	<script src="/build/awatokener.js"></script>
	<script src="/build/awaxecute.js"></script>
	<script src="/build/index.js"></script>
</body>

</html>
